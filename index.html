<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>进场码</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f4f7;color:#1a1a1a;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{background:linear-gradient(135deg,#07c160,#04a552);color:#fff;padding:18px 16px 26px}
h1{margin:0;font-size:19px;font-weight:650}
header p{margin:6px 0 0;font-size:12px;opacity:.9}
nav{position:sticky;top:0;z-index:5;background:rgba(242,244,247,.95);backdrop-filter:blur(6px);
  border-bottom:1px solid #e6e8eb;padding:8px 12px;display:flex;gap:8px;overflow-x:auto}
nav a{flex:none;font-size:12px;color:#03873f;background:#eafaf1;border:1px solid #b7e6c9;
  border-radius:999px;padding:5px 11px;text-decoration:none}
main{max-width:920px;margin:0 auto;padding:14px 12px 40px}
section{margin-bottom:22px}
h2{font-size:16px;margin:18px 2px 8px}
h3{font-size:13px;color:#41464d;margin:10px 2px 8px;padding-left:8px;border-left:3px solid #07c160}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:#fff;border-radius:12px;padding:8px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.card img{width:100%;aspect-ratio:1/1;display:block;border-radius:6px;background:#fff}
.cap{font-size:11px;color:#8a9099;margin-top:6px;line-height:1.5}
.cap b{display:block;color:#1a1a1a;font-size:12px;overflow-wrap:anywhere}
.empty{color:#b9bfc7;text-align:center;padding:50px 0;line-height:1.9}
footer{text-align:center;font-size:11px;color:#b9bfc7;margin-top:24px}
footer a{color:#03873f;text-decoration:none}
</style></head><body>
<header><h1>进场码</h1><p id="sub">加载中…</p></header>
<nav id="nav"></nav><main id="main"><div class="empty">加载中…</div></main>
<script>
const OWNER="xd188766-arch", REPO="qr-wall", BRANCH="main";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function label(d){const p=d.split("-");return p.length===3?(+p[1])+"月"+(+p[2])+"日":"未知日期";}
async function load(){
  $("#sub").textContent="加载中…";
  try{
    const u="https://api.github.com/repos/"+OWNER+"/"+REPO+"/git/trees/"+BRANCH+"?recursive=1&t="+Date.now();
    const r=await fetch(u,{headers:{"Accept":"application/vnd.github+json"}});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d=await r.json();
    const files=(d.tree||[]).filter(x=>x.type==="blob"&&x.path.indexOf("qr/")===0&&/\.png$/i.test(x.path));
    const items=files.map(x=>{
      const name=x.path.slice(3);
      const parts=name.replace(/\.png$/i,"").split("_");
      return {name,date:parts[0]||"",account:parts.length>1?parts[parts.length-1]:"",
              court:parts.length>2?parts.slice(1,-1).join("_"):"未标注场地"};
    }).filter(x=>x.date);
    items.sort((a,b)=>a.date===b.date?0:(a.date<b.date?1:-1));
    const dates=[...new Set(items.map(x=>x.date))];
    $("#sub").textContent="共 "+items.length+" 张 · "+dates.length+" 个日期";
    $("#nav").innerHTML=dates.map(d=>'<a href="#d-'+d+'">'+label(d)+'</a>').join("");
    if(!items.length){$("#main").innerHTML='<div class="empty">还没有码</div>';return;}
    let h="";
    for(const d of dates){
      h+='<section id="d-'+d+'"><h2>'+label(d)+'</h2>';
      const courts=[...new Set(items.filter(x=>x.date===d).map(x=>x.court))].sort();
      for(const c of courts){
        h+='<h3>'+esc(c)+'</h3><div class="grid">';
        for(const it of items.filter(x=>x.date===d&&x.court===c)){
          const src="qr/"+encodeURIComponent(it.name);
          h+='<div class="card"><a href="'+src+'" target="_blank"><img src="'+src+'" loading="lazy" alt=""></a>'+
             '<div class="cap"><b>'+esc(it.account||"默认")+'</b></div></div>';
        }
        h+="</div>";
      }
      h+="</section>";
    }
    $("#main").innerHTML=h;
  }catch(e){
    $("#sub").textContent="加载失败："+e.message;
    $("#main").innerHTML='<div class="empty">读取仓库文件失败（GitHub API 限流或网络问题）<br>稍后刷新，或直接看仓库 qr/ 目录</div>';
  }
}
load();
</script>
<footer>二维码由各自的服务端现生成 · <a href="https://xd188766-arch.github.io/yudongweilai/" target="_blank">羽动未来官网</a></footer>
</body></html>
